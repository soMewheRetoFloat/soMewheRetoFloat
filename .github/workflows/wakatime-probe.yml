name: Check WakaTime Today Access

on:
  push:
    branches:
      - profile/wakatime-today

permissions:
  contents: read

jobs:
  check-wakatime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.33.1
      - name: Check today's statistics
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python scripts/probe_wakatime.py
