name: Update WakaTime Profile

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "profile/**"
    paths:
      - ".github/workflows/profile-data.yml"
      - "scripts/**"
      - "requirements.txt"
      - "README.md"
      - "assets/tech-stack/**"

permissions:
  contents: write

concurrency:
  group: profile-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Tech Stack panel
        run: python scripts/build_tech_stack.py

      - name: Validate profile
        run: python scripts/check_profile.py --structure-only

      - name: Check WakaTime connection
        id: connection
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: |
          if [ -n "$WAKATIME_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WakaTime account connection is pending. Add WAKATIME_TOKEN to repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update WakaTime statistics
        if: steps.connection.outputs.configured == 'true'
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python scripts/update_wakatime.py

      - name: Validate WakaTime statistics
        if: steps.connection.outputs.configured == 'true'
        run: python scripts/check_profile.py

      - name: Commit WakaTime statistics
        if: steps.connection.outputs.configured == 'true'
        run: |
          git add -- README.md data/wakatime.json assets/tech-stack/panel.svg
          if git diff --cached --quiet; then
            echo "WakaTime statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update WakaTime statistics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
